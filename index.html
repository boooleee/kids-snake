<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>糖果贪吃蛇 · Three.js</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐍</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<!-- 非阻塞加载：国内加载不到时直接走本地回退字体，不白屏 -->
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Baloo+2:wght@600;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
<style>
  :root {
    --pink: #ff6f91;
    --yellow: #ffd93d;
    --mint: #6be7c6;
    --blue: #7ec8ff;
    --purple: #b18cff;
    --ink: #4a3b6b;
    --font: "ZCOOL KuaiLe", "Baloo 2", "Comic Sans MS", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; touch-action: none; }
  body {
    font-family: var(--font);
    background: linear-gradient(160deg, #aee6ff 0%, #fdf3c4 48%, #ffd7ec 100%);
    color: var(--ink);
    user-select: none;
  }
  /* 背景漂浮的小糖果 */
  .deco {
    position: fixed; z-index: -1; font-size: 54px; opacity: .55;
    animation: floaty 7s ease-in-out infinite; filter: drop-shadow(0 6px 10px rgba(0,0,0,.08));
  }
  @keyframes floaty {
    0%,100% { transform: translateY(0) rotate(-8deg); }
    50%     { transform: translateY(-26px) rotate(10deg); }
  }
  canvas { display: block; }

  /* ---------- 左上角：分数卡 ---------- */
  #hud {
    position: fixed; top: 14px; left: 14px; pointer-events: none;
    background: rgba(255,255,255,.85); backdrop-filter: blur(6px);
    border: 3px solid #fff; border-radius: 22px;
    padding: 10px 18px 12px; box-shadow: 0 10px 24px rgba(90,60,140,.18);
    min-width: 168px;
  }
  #hud .title {
    font-size: 17px; letter-spacing: 1px;
    background: linear-gradient(90deg, var(--pink), var(--purple), var(--blue));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  #hud .score { font-size: 34px; line-height: 1.1; color: #ff8c2b; display: inline-block; }
  #hud .combo { font-size: 15px; color: #8b7bb8; margin-top: 2px; }
  #hud .combo b { color: #ff8c2b; font-size: 18px; }
  .enc { margin: 4px 0 0; font-size: 15px; color: #9b8ec4; }
  .bump { animation: bump .38s cubic-bezier(.2,1.6,.4,1); }
  @keyframes bump { 0% { transform: scale(1); } 35% { transform: scale(1.4) rotate(-5deg); } 100% { transform: scale(1); } }

  /* ---------- 右上角：食物图鉴 ---------- */
  #legend {
    position: fixed; top: 14px; right: 14px;
    background: rgba(255,255,255,.85); backdrop-filter: blur(6px);
    border: 3px solid #fff; border-radius: 22px;
    padding: 10px 12px; box-shadow: 0 10px 24px rgba(90,60,140,.18);
    max-width: 232px;
  }
  #legend .lg-title { font-size: 14px; color: #8b7bb8; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #snd { border: 0; background: var(--yellow); border-radius: 999px; width: 30px; height: 30px; font-size: 15px; cursor: pointer; box-shadow: 0 3px 0 #e0b400; font-family: var(--font); }
  #snd:active { transform: translateY(2px); box-shadow: 0 1px 0 #e0b400; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    display: inline-flex; align-items: center; gap: 3px;
    background: #fff; border: 2px solid var(--c, #eee); border-radius: 999px;
    padding: 3px 9px; font-size: 15px; box-shadow: 0 2px 0 var(--c, #eee);
  }
  .chip b { color: var(--c); font-size: 15px; }

  /* ---------- 覆盖层 ---------- */
  .overlay {
    position: fixed; inset: 0; display: none; place-items: center; z-index: 30;
    background: rgba(90, 60, 140, .35); backdrop-filter: blur(4px); padding: 16px;
  }
  .overlay.show { display: grid; }
  .card {
    background: #fffdf7; border: 5px solid #fff; border-radius: 34px;
    padding: 22px 28px 26px; text-align: center; max-width: 460px; width: 100%;
    box-shadow: 0 24px 50px rgba(70,40,120,.3);
    animation: pop .45s cubic-bezier(.2,1.5,.4,1);
  }
  @keyframes pop { from { transform: scale(.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .card .mascot { font-size: 60px; animation: floaty 3.4s ease-in-out infinite; }
  .card h1, .card h2 { margin: 6px 0 2px; font-size: 34px; letter-spacing: 2px; }
  .card h1 { background: linear-gradient(90deg, var(--pink), var(--purple), var(--blue));
             -webkit-background-clip: text; background-clip: text; color: transparent; }
  .card .sub { margin: 4px 0 12px; font-size: 16px; color: #8b7bb8; }
  .final { font-size: 44px; color: #ff8c2b; margin: 6px 0; }
  .medal { font-size: 46px; }
  .bestline { font-size: 17px; color: #8b7bb8; margin-top: 4px; }
  .newbest { color: #ff5b6a; margin-left: 6px; display: none; }
  .newbest.show { display: inline; animation: bump .6s ease; }

  .modes { display: flex; gap: 10px; justify-content: center; margin: 10px 0 16px; }
  .mode {
    flex: 1; border: 3px solid #eae2ff; background: #f8f5ff; border-radius: 20px;
    padding: 10px 6px; cursor: pointer; font-family: var(--font); font-size: 16px; color: var(--ink);
    transition: .15s;
  }
  .mode small { display: block; font-size: 12px; color: #9b8ec4; margin-top: 4px; }
  .mode.on { border-color: var(--pink); background: #fff0f5; box-shadow: 0 6px 16px rgba(255,111,145,.3); transform: translateY(-2px); }

  .big-btn {
    border: 0; cursor: pointer; font-family: var(--font); font-size: 24px; color: #fff;
    padding: 14px 40px; border-radius: 999px; margin-top: 6px;
    background: linear-gradient(96deg, var(--pink), var(--yellow));
    box-shadow: 0 8px 0 #e8607f, 0 16px 26px rgba(255,111,145,.35);
    letter-spacing: 2px;
  }
  .big-btn:hover { filter: brightness(1.05); }
  .big-btn:active { transform: translateY(6px); box-shadow: 0 2px 0 #e8607f; }
  .ghost-btn {
    border: 0; cursor: pointer; font-family: var(--font); font-size: 17px; color: var(--ink);
    background: #f1ecff; border-radius: 999px; padding: 11px 22px; margin: 14px 6px 0;
    box-shadow: 0 4px 0 #ddd3ff;
  }
  .ghost-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #ddd3ff; }
  .hint { font-size: 13px; color: #a89ac8; margin-top: 12px; }

  /* ---------- 道具效果 HUD ---------- */
  #fx { margin-top: 7px; display: flex; flex-wrap: wrap; gap: 4px; }
  .fxchip {
    display: inline-flex; align-items: center; gap: 4px;
    background: #fff; border: 2px solid var(--c); border-radius: 999px;
    padding: 2px 9px; font-size: 13px; box-shadow: 0 2px 0 var(--c);
    color: var(--c); font-weight: 700;
  }
  .fxchip b { font-size: 13px; }

  /* ---------- 滑动方向指示 ---------- */
  #swipe {
    position: fixed; left: 50%; top: 45%; transform: translate(-50%,-50%);
    font-size: 80px; pointer-events: none; z-index: 20; opacity: 0;
  }
  #swipe.on { animation: swipePop .5s ease; }
  @keyframes swipePop {
    0%   { opacity: 0; transform: translate(-50%,-50%) scale(.55); }
    22%  { opacity: .9; }
    100% { opacity: 0; transform: translate(-50%,-50%) scale(1.3); }
  }

  /* ---------- 徽章 ---------- */
  .achv { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; margin: 10px 0 2px; }
  .achv .b { font-size: 24px; filter: grayscale(1) opacity(.32); transition: .25s; }
  .achv .b.on { filter: none; }
  .achv .b.new { animation: bump .7s ease; }
  .achv-cap { font-size: 12px; color: #a89ac8; margin: 6px 0 2px; }

  /* ---------- 分享卡 ---------- */
  #share .card { max-width: 384px; padding: 16px; }
  #shareImg { width: 100%; border-radius: 16px; box-shadow: 0 10px 26px rgba(90,60,140,.25); display: block; }
  .share-row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; justify-content: center; }
  /* 结算卡按钮：弹性换行，窄屏不拥挤 */
  .over-btns { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .over-btns .ghost-btn { margin: 0; }

  /* 吃到食物时屏幕轻微闪光 */
  #flash {
    position: fixed; inset: 0; z-index: 25; pointer-events: none; opacity: 0;
    background: radial-gradient(circle at 50% 55%, rgba(255,255,255,.75), rgba(255,255,255,0) 65%);
  }
  #flash.on { animation: flash .38s ease; }
  @keyframes flash { 0% { opacity: .9; } 100% { opacity: 0; } }

  @media (max-width: 720px) {
    #hud { min-width: 0; }
    #hud .title { font-size: 15px; }
    #hud .score { font-size: 24px; }
    #hud .combo { font-size: 13px; }
    #hud .combo b { font-size: 15px; }
    #hud .best { font-size: 13px; }
    #legend { max-width: 100%; padding: 8px; }
    .chip { font-size: 13px; padding: 2px 7px; }
    .fxchip { font-size: 12px; padding: 1px 7px; }
    #swipe { font-size: 64px; }
  }
</style>
</head>
<body>

<div class="deco" style="left:6%;  top:22%; animation-delay:-1s">🎈</div>
<div class="deco" style="left:84%; top:64%; animation-delay:-3s">🍭</div>
<div class="deco" style="left:12%; top:74%; animation-delay:-4.5s">🍬</div>
<div class="deco" style="left:78%; top:16%; animation-delay:-2s">🌈</div>
<div class="deco" style="left:46%; top:86%; animation-delay:-5.5s; font-size:42px">⭐</div>
<div class="deco" style="left:64%; top:38%; animation-delay:-6.5s; font-size:40px">🍩</div>

<div id="hud">
  <div class="title">🍬 糖果贪吃蛇</div>
  <div class="score">⭐ <span id="score">0</span></div>
  <div class="combo">连击 <b id="combo">0</b></div>
  <div class="best">🏆 最高 <span id="best">0</span></div>
  <div id="fx" hidden></div>
</div>

<div id="legend">
  <div class="lg-title"><span class="lg-label">🎒 食物图鉴</span><button id="snd" title="开关音效">🔊</button></div>
  <div class="chips" id="chips"></div>
</div>

<div id="flash"></div>
<div id="swipe"></div>

<div id="pause" class="overlay">
  <div class="card">
    <div class="mascot">😴</div>
    <h2>休息一下吧</h2>
    <p class="sub">按 P 或点按钮继续</p>
    <button id="resume" class="big-btn">▶ 继续玩耍</button>
  </div>
</div>

<!-- 方向键已改为整屏滑动 -->

<div id="start" class="overlay show">
  <div class="card">
    <div class="mascot">🐍🍭</div>
    <h1>糖果贪吃蛇</h1>
    <p class="sub">吃掉不同的食物，分数不一样哦！</p>
    <div class="chips" id="chips2" style="justify-content:center"></div>
    <div class="modes">
      <button class="mode on" data-mode="easy">🌈 轻松模式<small>撞到墙会穿过去</small></button>
      <button class="mode" data-mode="hard">🔥 挑战模式<small>撞到墙就结束</small></button>
    </div>
    <button id="play" class="big-btn">▶ 开始玩耍</button>
    <p class="hint">📱 滑动 · ⌨ 方向键/WASD 控制 · P 暂停 · R 重开</p>
  </div>
</div>

<div id="over" class="overlay">
  <div class="card">
    <div class="mascot" id="overMascot">🐍</div>
    <h2 id="overTitle">游戏结束啦</h2>
    <div class="final">得分 <span id="final">0</span></div>
    <div class="medal" id="medal">🥉</div>
    <div id="achv" class="achv"></div>
    <div class="achv-cap" id="achvCap">🏆 徽章 0 / 9</div>
    <div class="bestline">🏆 最高 <span id="best2">0</span><span id="newbest" class="newbest">🎉 新纪录！</span></div>
    <p class="enc" id="overEnc">没关系，再来一次会更棒！</p>
    <div class="over-btns">
      <button id="again" class="big-btn">🔁 再玩一局</button>
      <button id="menu" class="ghost-btn">🏠 换模式</button>
      <button id="shareBtn" class="ghost-btn">📤 分享战绩</button>
    </div>
    <p class="hint">按 R 或 Enter 也能重新开始</p>
  </div>
</div>

  <div id="share" class="overlay">
    <div class="card">
      <h2>📤 战绩卡片</h2>
      <p class="sub">保存或复制，发给小伙伴炫耀吧～</p>
      <img id="shareImg" alt="战绩卡片" />
      <div class="share-row">
        <button id="shareSave" class="big-btn" style="font-size:18px;padding:11px 22px">💾 保存卡片</button>
        <button id="shareCopy" class="ghost-btn" style="margin:0">📋 复制图片</button>
        <button id="shareClose" class="ghost-btn" style="margin:0">关闭</button>
      </div>
      <p class="hint">有些手机「复制图片」不可用时，用「保存卡片」存到相册/下载。</p>
    </div>
  </div>

<script type="module">
// ============ 3D 引擎多 CDN 兜底（国内 jsDelivr/npmmirror 优先，海外 unpkg 殿后）============
const CDN_CHAIN = [
  'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js',
  'https://registry.npmmirror.com/three/0.160.0/files/build/three.module.js',
  'https://unpkg.com/three@0.160.0/build/three.module.js',
];
let THREE = null;
for (const url of CDN_CHAIN) {
  try { THREE = await import(url); break; } catch (_) { /* 换下一个 */ }
}
if (!THREE) {
  document.body.innerHTML =
    '<div style="display:grid;place-items:center;height:100vh;font-family:sans-serif;font-size:20px;color:#4a3b6b">' +
    '🐍 加载 3D 引擎失败（几个 CDN 都连不上）。<br>换个网络或清下代理再刷新试试～</div>';
  throw new Error('three failed to load');
}

// ================= 常量 =================
const N = 16;            // 网格 N x N
const CELL = 1;          // 格子世界尺寸
const TICK0 = 180;       // 初始步长 ms（比原版慢一点，小朋友更从容）
const TICK_MIN = 95;     // 最快步长
const TICK_STEP = 3.5;   // 每得 1 分加速多少

const wx = i => i - N / 2 + 0.5;
const wz = j => j - N / 2 + 0.5;

// ================= 食物图鉴（不同食物不同加分） =================
const FOODS = [
  { e: '🍎', n: '苹果',   p: 1, w: 30, c: 0xff5b6a },
  { e: '🥕', n: '胡萝卜', p: 2, w: 20, c: 0xff9f43 },
  { e: '🍓', n: '草莓',   p: 2, w: 16, c: 0xff6f91 },
  { e: '🍌', n: '香蕉',   p: 3, w: 13, c: 0xffd93d },
  { e: '🍇', n: '葡萄',   p: 4, w: 9,  c: 0xa66dd4 },
  { e: '🍩', n: '甜甜圈', p: 5, w: 7,  c: 0xf78fb3 },
  { e: '⭐', n: '幸运星', p: 8, w: 5, c: 0xffb400, timeLimit: 7000 },
];
const TOTAL_W = FOODS.reduce((s, f) => s + f.w, 0);
function pickFood() {
  let r = Math.random() * TOTAL_W;
  for (const f of FOODS) { if ((r -= f.w) <= 0) return f; }
  return FOODS[0];
}

// ================= 道具（吃后获得临时能力） =================
const POWERS = [
  { e: '⏱', n: '慢动作', power: 'slow',   c: 0x7ec8ff, p: 2, w: 26 },
  { e: '🛡', n: '护身',   power: 'shield', c: 0x6be7c6, p: 2, w: 26 },
  { e: '👁', n: '透视',   power: 'xray',   c: 0xb18cff, p: 2, w: 24 },
  { e: '💨', n: '冲刺',   power: 'dash',   c: 0xff9f43, p: 2, w: 24 },
];
const POWER_TOTAL = POWERS.reduce((s, p) => s + p.w, 0);
const POWER_CHANCE = 0.30;   // 30% 概率刷出道具
function pickPower() {
  let r = Math.random() * POWER_TOTAL;
  for (const p of POWERS) { if ((r -= p.w) <= 0) return p; }
  return POWERS[0];
}

// 图鉴徽章（HUD + 开始界面共用；普通食物 + 道具）
const chipHTML =
  FOODS.map(f => `<span class="chip" style="--c:#${f.c.toString(16).padStart(6, '0')}">${f.e} <b>+${f.p}</b></span>`).join('') +
  '<span style="flex-basis:100%"></span>' +
  POWERS.map(f => `<span class="chip" style="--c:#${f.c.toString(16).padStart(6, '0')};opacity:.9">${f.e} <b>${f.n}</b></span>`).join('');
document.getElementById('chips').innerHTML = chipHTML;
document.getElementById('chips2').innerHTML = chipHTML;

// ================= 渲染 =================
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();

const half = N * CELL / 2;
const camera = new THREE.OrthographicCamera(-half, half, half, -half, 0.1, 100);
camera.position.set(0, 20, 0.001);
camera.lookAt(0, 0, 0);

// ---------- 糖果棋盘（画布纹理，四色柔和方格） ----------
const PALETTE = ['#ffe3ef', '#dff6ff', '#fff5c9', '#e3ffe6'];
const fcv = document.createElement('canvas');
fcv.width = fcv.height = N;
const fx = fcv.getContext('2d');
for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
  fx.fillStyle = PALETTE[(i % 2) * 2 + (j % 2)];
  fx.fillRect(i, j, 1, 1);
}
const floorTex = new THREE.CanvasTexture(fcv);
floorTex.magFilter = THREE.NearestFilter;
floorTex.colorSpace = THREE.SRGBColorSpace;

const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(N, N),
  new THREE.MeshLambertMaterial({ map: floorTex })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -0.51;
scene.add(floor);

// 棋盘下方的柔和投影，让棋盘像放在桌面上
const shadow = new THREE.Mesh(
  new THREE.PlaneGeometry(N + 1.6, N + 1.6),
  new THREE.MeshBasicMaterial({ color: 0x6b4fa8, transparent: true, opacity: .16, depthWrite: false })
);
shadow.rotation.x = -Math.PI / 2;
shadow.position.y = -0.62;
scene.add(shadow);

// ---------- 糖果围栏（四面不同颜色） ----------
const WALL_H = 0.55;
[
  { x: 0,        z: -N / 2, w: N + .5, d: .4, c: 0xff9ecb },
  { x: N / 2,    z: 0,      w: .4,     d: N + .5, c: 0x8fd3ff },
  { x: 0,        z: N / 2,  w: N + .5, d: .4, c: 0xffe08a },
  { x: -N / 2,   z: 0,      w: .4,     d: N + .5, c: 0x9ff0c8 },
].forEach(s => {
  const m = new THREE.Mesh(
    new THREE.BoxGeometry(s.w, WALL_H, s.d),
    new THREE.MeshLambertMaterial({ color: s.c })
  );
  m.position.set(s.x, -0.5 + WALL_H / 2, s.z);
  scene.add(m);
});

const dirLight = new THREE.DirectionalLight(0xffffff, 1.15);
dirLight.position.set(8, 18, 6);
scene.add(dirLight, new THREE.AmbientLight(0xffffff, .95));

// ================= 蛇 =================
const segGeo = new THREE.SphereGeometry(0.45, 20, 16);
const whiteMat = new THREE.MeshLambertMaterial({ color: 0xffffff });
const blackMat = new THREE.MeshLambertMaterial({ color: 0x2b2140 });

function makeSeg() {
  const g = new THREE.Group();
  const body = new THREE.Mesh(segGeo, new THREE.MeshLambertMaterial({ color: 0x3fb950 }));
  g.add(body);
  const eyes = new THREE.Group();
  for (const sx of [-1, 1]) {
    const w = new THREE.Mesh(new THREE.SphereGeometry(0.14, 12, 10), whiteMat);
    w.position.set(sx * 0.18, 0.17, -0.33);
    const b = new THREE.Mesh(new THREE.SphereGeometry(0.075, 10, 8), blackMat);
    b.position.set(sx * 0.18, 0.18, -0.44);
    eyes.add(w, b);
  }
  eyes.visible = false;
  g.add(eyes);
  g.userData = { body, eyes };
  g.visible = false;
  scene.add(g);
  return g;
}
const pool = Array.from({ length: N * N }, makeSeg);

// ---------- 护盾光环（套在蛇头，可叠 2 层） ----------
const shieldRing = new THREE.Mesh(
  new THREE.TorusGeometry(0.68, 0.08, 12, 28),
  new THREE.MeshBasicMaterial({ color: 0x6be7c6, transparent: true, opacity: .8 })
);
shieldRing.rotation.x = Math.PI / 2;
shieldRing.position.y = 0;
shieldRing.visible = false;
scene.add(shieldRing);

const emojiTexCache = new Map();
function emojiTexture(e) {
  if (emojiTexCache.has(e)) return emojiTexCache.get(e);
  const cv = document.createElement('canvas');
  cv.width = cv.height = 128;
  const x = cv.getContext('2d');
  x.font = '92px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
  x.textAlign = 'center';
  x.textBaseline = 'middle';
  x.fillText(e, 64, 70);
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace;
  emojiTexCache.set(e, t);
  return t;
}

function badgeTexture(p, c) {
  const cv = document.createElement('canvas');
  cv.width = 160; cv.height = 96;
  const x = cv.getContext('2d');
  const r = 40;
  x.beginPath();
  x.moveTo(r, 12); x.lineTo(160 - r, 12);
  x.quadraticCurveTo(152, 12, 152, 12 + r); x.lineTo(152, 84 - r);
  x.quadraticCurveTo(152, 84, 152 - r, 84); x.lineTo(r, 84);
  x.quadraticCurveTo(8, 84, 8, 84 - r); x.lineTo(8, 12 + r);
  x.quadraticCurveTo(8, 12, r, 12); x.closePath();
  x.fillStyle = '#ffffff'; x.fill();
  x.lineWidth = 7; x.strokeStyle = '#' + c.toString(16).padStart(6, '0'); x.stroke();
  x.font = '800 56px "Baloo 2","ZCOOL KuaiLe","PingFang SC","Microsoft YaHei",sans-serif';
  x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillStyle = '#' + c.toString(16).padStart(6, '0');
  x.fillText('+' + p, 80, 52);
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

function makeFood(type) {
  const g = new THREE.Group();

  const glow = new THREE.Mesh(
    new THREE.CircleGeometry(0.46, 32),
    new THREE.MeshBasicMaterial({ color: type.c, transparent: true, opacity: .38, depthWrite: false })
  );
  glow.rotation.x = -Math.PI / 2;
  glow.position.y = -0.44;
  g.add(glow);

  const spr = new THREE.Sprite(new THREE.SpriteMaterial({
    map: emojiTexture(type.e), transparent: true, depthWrite: false
  }));
  spr.scale.set(0.8, 0.8, 1);
  spr.position.y = 0.28;
  g.add(spr);

  const badge = new THREE.Sprite(new THREE.SpriteMaterial({
    map: badgeTexture(type.p, type.c), transparent: true, depthWrite: false
  }));
  badge.scale.set(0.5, 0.3, 1);
  badge.position.set(0.34, 0.74, 0);
  g.add(badge);

  g.userData = { glow, spr, phase: Math.random() * 6.28 };
  scene.add(g);
  return g;
}

function beep(freq, dur = .12, type = 'sine', vol = .18) {
  if (muted) return;
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
    o.connect(g).connect(actx.destination);
    o.start(); o.stop(actx.currentTime + dur);
  } catch (_) { /* 忽略 */ }
}

function emptyCell() {
  const occupied = new Set(snake.map(s => s.x + ',' + s.z));
  foods.forEach(f => occupied.add(f.x + ',' + f.z));
  const free = [];
  for (let i = 0; i < N; i++) for (let j = 0; j < N; j++)
    if (!occupied.has(i + ',' + j)) free.push([i, j]);
  return free.length ? free[(Math.random() * free.length) | 0] : null;
}

function spawnFood() {
  const c = emptyCell();
  if (!c) {
    // 棋盘被吃满：仅在对局中算胜利，其他界面下静默不处理（修掉满盘误触 gameOver）
    if (state === 'playing' && alive) gameOver(true);
    return;

  const type = Math.random() < POWER_CHANCE ? pickPower() : pickFood();
  const f = { x: c[0], z: c[1], type, mesh: makeFood(type) };
  if (type.timeLimit) f.expireAt = performance.now() + type.timeLimit;
  foods.push(f);
}

let fxHudAt = 0;
function updateFx(nowMs) {
  const now = nowMs;
  // 护盾光环套在蛇头
  if (shield > 0) {
    shieldRing.visible = true;
    const h = snake[0];
    shieldRing.position.set(wx(h.x), 0, wz(h.z));
    shieldRing.rotation.z += 0.05;
    shieldRing.material.opacity = 0.5 + 0.3 * Math.sin(now / 150);
  } else shieldRing.visible = false;
  // 透视面包屑：蛇头 → 最高价值且未过期的食物
  const xrayOn = pfx.xray > now && state === 'playing' && alive;
  let target = null;
  if (xrayOn) target = foods.filter(f => !f.expireAt || f.expireAt > now).sort((a, b) => b.type.p - a.type.p)[0] || null;
  for (let i = 0; i < xrayDots.length; i++) {
    const d = xrayDots[i];
    if (xrayOn && target) {
      const h = snake[0];
      const f = (i + 1) / (xrayDots.length + 1);
      d.visible = true;
      d.position.x = wx(h.x) + (wx(target.x) - wx(h.x)) * f;
      d.position.z = wz(h.z) + (wz(target.z) - wz(h.z)) * f;
      d.material.opacity = 0.35 + 0.4 * (0.5 + 0.5 * Math.sin(now / 200 + i * 0.5));
      d.scale.setScalar(0.6 + 0.9 * f);
    } else d.visible = false;
  }
  // 冲刺尾迹
  if (pfx.dash > now && state === 'playing' && alive && Math.random() < 0.55) burst(snake[snake.length - 1], 0xff9f43);
}
function updateFxHud(nowMs) {
  if (nowMs - fxHudAt < 100) return;
  fxHudAt = nowMs;
  const remain = s => Math.max(0, Math.ceil((s - nowMs) / 1000));
  const items = [];
  if (pfx.slow > nowMs) items.push(`<span class="fxchip" style="--c:#7ec8ff">⏱ <b>${remain(pfx.slow)}s</b></span>`);
  if (pfx.dash > nowMs) items.push(`<span class="fxchip" style="--c:#ff9f43">💨 <b>${remain(pfx.dash)}s</b></span>`);
  if (pfx.xray > nowMs) items.push(`<span class="fxchip" style="--c:#b18cff">👁 <b>${remain(pfx.xray)}s</b></span>`);
  if (shield > 0) items.push(`<span class="fxchip" style="--c:#6be7c6">🛡 <b>×${shield}</b></span>`);
  const el = document.getElementById('fx');
  el.hidden = items.length === 0;
  el.innerHTML = items.join('');
}

function step() {
  if (pending.length) dir = pending.shift();
  let head = { x: snake[0].x + dir.x, z: snake[0].z + dir.z };
  const now = performance.now();

  if (head.x < 0 || head.x >= N || head.z < 0 || head.z >= N) {
    if (mode === 'easy') {                 // 轻松模式：穿墙而过
      head.x = (head.x + N) % N;
      head.z = (head.z + N) % N;
      beep(300, .06, 'square', .1);
    } else if (shield > 0) {              // 护盾：挡下撞墙，弹到对面
      shield--; stats.usedShield = true;
      shieldPop(head);
      head.x = (head.x + N) % N;
      head.z = (head.z + N) % N;
    } else {
      return gameOver();
    }
  }

  const key = head.x + ',' + head.z;
  if (snake.slice(0, -1).some(s => s.x + ',' + s.z === key)) {
    if (shield > 0) { shield--; stats.usedShield = true; shieldPop(head); return; }  // 护盾：这一格冻结，快转向！
    return gameOver();
  }
  snake.unshift(head);

  const eatIdx = foods.findIndex(f => f.x === head.x && f.z === head.z);
  if (eatIdx >= 0) {
    const type = foods[eatIdx].type;
    const dashOn = pfx.dash > now;
    const gained = dashOn ? type.p * 2 : type.p;
    score += gained;
    combo++;
    stats.eaten++;
    stats.maxCombo = Math.max(stats.maxCombo, combo);
    if (type.e === '⭐') stats.stars++;
    lastEatAt = performance.now();   // 刷新连击保持窗口
    scoreEl.textContent = score;
    scoreEl.classList.remove('bump'); void scoreEl.offsetWidth; scoreEl.classList.add('bump');
    comboEl.textContent = combo;
    const fl = document.getElementById('flash');
    fl.classList.remove('on'); void fl.offsetWidth; fl.classList.add('on');
    tickMs = Math.max(TICK_MIN, TICK0 - score * TICK_STEP);
    addPopup((dashOn ? '💨+' : '+') + gained, head, dashOn ? '#ff9f43' : '#' + type.c.toString(16).padStart(6, '0'));
    if (combo > 0 && combo % 5 === 0) addPopup('连击 x' + combo + '!', head, '#e8590c');
    burst(head, type.c);
    eatSound(type.p);
    if (type.power) applyPower(type.power, head);
    removeFood(eatIdx);
    spawnFood();
    if (score > best) { best = score; localStorage.setItem('candy-snake-best', best); bestEl.textContent = best; }
  } else {
    snake.pop();
  }
  renderSnake();
}

function medal(s) {
  if (s >= 100) return '👑';
  if (s >= 60) return '🥇';
  if (s >= 30) return '🥈';
  if (s >= 10) return '🥉';
  return '🌟';
}

const ENC = [
  '没关系，再来一次会更棒！', '哇，好接近了，再冲一把！', '小蛇已经很棒啦，加油！',
  '下次试试更小心地转弯～', '吃得越多分越高，试试金色星星！', '贪吃蛇精神：永不放弃！',
];
function gameOver(win = false) {
  alive = false;
  state = 'over';
  finalEl.textContent = score;
  best2El.textContent = best;
  medalEl.textContent = win ? '👑' : medal(score);
  overTitle.textContent = win ? '棋盘吃满啦！' : (score >= 60 ? '太厉害啦！' : '游戏结束啦');
  overMascot.textContent = win ? '🏆' : (score >= 60 ? '🥳' : '🐍');
  overEncEl.textContent = win ? '全吃光了，你就是糖果王！' : ENC[(Math.random() * ENC.length) | 0];
  const isBest = score > 0 && score >= best;
  newbestEl.classList.toggle('show', isBest);
  stats.win = win;
  const newly = checkAchv();
  renderAchv(newly);
  overEl.classList.add('show');
  overSound();
}

function startGame() {
  reset();
  state = 'playing';
  startEl.classList.remove('show');
  beep(520, .1, 'triangle', .18);
  setTimeout(() => beep(780, .14, 'triangle', .16), 90);
}
function restart() { reset(); state = 'playing'; }

// ================= 暂停 =================
function pauseGame() {
  if (state !== 'playing' || paused) return;
  paused = true;
  pausedAt = performance.now();
  // 限时食物（⭐）暂停时冻结剩余时间，恢复时平移
  for (const f of foods) if (f.expireAt != null) f.savedRemain = f.expireAt - performance.now();
  pauseEl.classList.add('show');
  beep(400, .08, 'sine', .12);
}
function resumeGame() {
  if (!paused) return;
  const d = performance.now() - pausedAt;
  for (const f of foods) {
    if (f.savedRemain != null) { f.expireAt = performance.now() + f.savedRemain; f.savedRemain = null; }
  }
  paused = false;
  last = performance.now();          // 防止恢复瞬间补步
  pauseEl.classList.remove('show');
  beep(620, .08, 'sine', .12);
}
resumeBtn.addEventListener('click', resumeGame);
// 切到后台自动暂停，回来不会冤死
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });
function toMenu() {
  overEl.classList.remove('show');
  startEl.classList.add('show');
  state = 'start';
}

// ================= 输入 =================
const DIRS = {
  ArrowUp: { x: 0, z: -1 }, w: { x: 0, z: -1 },
  ArrowDown: { x: 0, z: 1 }, s: { x: 0, z: 1 },
  ArrowLeft: { x: -1, z: 0 }, a: { x: -1, z: 0 },
  ArrowRight: { x: 1, z: 0 }, d: { x: 1, z: 0 },
};
const PAD = {
  up: { x: 0, z: -1 }, down: { x: 0, z: 1 },
  left: { x: -1, z: 0 }, right: { x: 1, z: 0 },
};
function turn(d) {
  const last = pending[pending.length - 1] || dir;
  if ((last.x === -d.x && last.z === -d.z) || (last.x === d.x && last.z === d.z)) return;
  if (pending.length < 2) pending.push(d);
}

addEventListener('keydown', e => {
  const k = e.key;
  const d = DIRS[k] || DIRS[k.toLowerCase()];
  if (state === 'start') {
    if (d || k === 'Enter' || k === ' ') { e.preventDefault(); startGame(); if (d) turn(d); }
    return;
  }
  if (state === 'over') {
    if (k.toLowerCase() === 'r' || k === 'Enter' || k === ' ') { e.preventDefault(); restart(); }
    return;
  }
  if (state === 'playing') {
    if (k.toLowerCase() === 'p') { e.preventDefault(); paused ? resumeGame() : pauseGame(); return; }
    if (paused) return;              // 暂停时不响应方向键
  }
  if (k.toLowerCase() === 'r') { restart(); return; }
  if (!d) return;
  e.preventDefault();
  turn(d);
});

// 整屏滑动切方向（触屏）——避开按钮/面板
const SWIPE_MIN = 24;
let swipe = null;
function showSwipe(name) {
  const el = document.getElementById('swipe');
  el.textContent = { up: '⬆️', down: '⬇️', left: '⬅️', right: '➡️' }[name];
  el.classList.remove('on'); void el.offsetWidth; el.classList.add('on');
}
function doSwipe(name) {
  showSwipe(name);
  if (state === 'start') { startGame(); return; }
  if (state === 'playing' && !paused) turn(PAD[name]);
}
function swipeFrom(dx, dy) {
  if (Math.abs(dx) < SWIPE_MIN && Math.abs(dy) < SWIPE_MIN) return;
  doSwipe(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
}
addEventListener('touchstart', e => {
  if (e.target.closest('button, .overlay, #legend, #hud')) return;
  const t = e.touches[0]; swipe = { x: t.clientX, y: t.clientY };
}, { passive: true });
addEventListener('touchend', e => {
  if (!swipe) return;
  const t = e.changedTouches[0];
  swipeFrom(t.clientX - swipe.x, t.clientY - swipe.y); swipe = null;
}, { passive: true });

document.getElementById('play').addEventListener('click', startGame);
document.getElementById('again').addEventListener('click', restart);
document.getElementById('menu').addEventListener('click', toMenu);
document.querySelectorAll('.mode').forEach(btn => {
  btn.addEventListener('click', () => {
    mode = btn.dataset.mode;
    document.querySelectorAll('.mode').forEach(b => b.classList.toggle('on', b === btn));
    beep(600, .07, 'triangle', .15);
  });
});

// ================= 主循环 =================
let acc = 0, last = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  if (paused) { last = now; return; }   // 暂停时冻结整个场景
  const dt = Math.min((now - last) / 1000, 0.1);
  acc += Math.min(now - last, 500);
  last = now;
  const et = effTick();
  while (acc >= et) {
    acc -= et;
    if (state === 'playing' && alive) step();
  }
  // 连击衰减：窗口内没吃到就归零
  if (state === 'playing' && combo > 0 && now - lastEatAt > COMBO_MS) {
    combo = 0;
    comboEl.textContent = '0';
  }
  // 道具效果（护盾光环 / 透视面包屑 / 冲刺尾迹 / HUD 计时）
  const nowFx = performance.now();
  updateFx(nowFx);
  updateFxHud(nowFx);

  const t = now / 1000;
  // 食物：上下浮动 + 轻轻摇摆 + 光晕呼吸
  // 限时食物（⭐）过期自动跑掉，并闪烁提示
  const nowMs = performance.now();
  for (let i = foods.length - 1; i >= 0; i--) {
    const f = foods[i];
    if (f.expireAt) {
      const remain = f.expireAt - nowMs;
      if (remain <= 0) {
        removeFood(i);
        if (state === 'playing' && alive) spawnFood();
        continue;
      }
      if (remain < 2000) {
        const on = Math.floor(remain / 150) % 2 === 0;
        f.mesh.userData.spr.material.opacity = on ? 1 : 0.35;
      } else {
        f.mesh.userData.spr.material.opacity = 1;
      }
    }
  }
  // 食物：上下浮动 + 轻轻摇摆 + 光晕呼吸
  foods.forEach(f => {
    const u = f.mesh.userData;
    f.mesh.position.set(wx(f.x), 0.06 * Math.sin(t * 3 + u.phase), wz(f.z));
    u.spr.material.rotation = 0.14 * Math.sin(t * 2 + u.phase);
    u.glow.material.opacity = 0.28 + 0.16 * (0.5 + 0.5 * Math.sin(t * 4 + u.phase));
  });
  // 飘字
  for (let i = popups.length - 1; i >= 0; i--) {
    const p = popups[i];
    p.life += dt;
    p.sp.position.y += dt * 1.3;
    p.sp.material.opacity = Math.max(0, 1 - p.life / 0.95);
    if (p.life > 0.95) { scene.remove(p.sp); p.tex.dispose(); p.sp.material.dispose(); popups.splice(i, 1); }
  }
  // 粒子
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life += dt;
    p.vy -= 9 * dt;
    p.m.position.x += p.vx * dt;
    p.m.position.y = Math.max(0.02, p.m.position.y + p.vy * dt);
    p.m.position.z += p.vz * dt;
    p.m.scale.setScalar(Math.max(0.01, 1 - p.life / 0.75));
    if (p.life > 0.75) { scene.remove(p.m); particles.splice(i, 1); }
  }

  renderer.render(scene, camera);
}
reset();
state = 'start';
loop(performance.now());

// ================= 调试钩子（供自动化测试读取） =================
window.__candy = {
  get state() { return state; },
  get score() { return score; },
  get tick() { return tickMs; },
  get head() { return { ...snake[0] }; },
  get dir() { return { ...dir }; },
  get foods() { return foods.map(f => ({ x: f.x, z: f.z, p: f.type.p, e: f.type.e, exp: f.expireAt || 0 })); },
  get combo() { return combo; },
  get powers() { return { slow: pfx.slow, dash: pfx.dash, xray: pfx.xray, shield }; },
  get achv() { return [...unlocked]; },
  get stats() { return { ...stats }; },
  get boardRect() { // 棋盘在屏幕像素中的矩形（供自动化校验不被面板遮挡）
    const v = new THREE.Vector3();
    const px = x => (1 + v.set(x, 0, scene.position.z).project(camera).x) / 2 * innerWidth;
    // 相机 up 轴 = 世界 +Z：NDC.y 随 z 增大而增大，屏幕像素 y 相反
    const py = z => (1 - v.set(0, 0, z + scene.position.z).project(camera).y) / 2 * innerHeight;
    return { top: py(-half), bottom: py(half), left: px(-half), right: px(half) };
  },
};
 // ================= 自适应相机（格子永远正方形，棋盘让开面板） =================
 function fitCamera() {
   const w = innerWidth, h = innerHeight;
   const r = id => document.getElementById(id).getBoundingClientRect();
   const top = Math.max(r('hud').bottom, r('legend').bottom, 0);
   const bot = h - 8;   // 方向键已移除，棋盘下边界用屏幕底边
   const s = Math.max(60, Math.min(w, bot - top - 8));  // 棋盘边长 px
   const k = N / s;                                       // 每像素世界单位（两轴相同 → 格子正方形）
   const a = w * k / 2, a2 = h * k / 2;
   camera.left = -a; camera.right = a;
   camera.top = a2; camera.bottom = -a2;
   camera.updateProjectionMatrix();
   // 棋盘中心（局部 0,0）平移到可用区像素中心 (w/2, (top+bot)/2)：
   // 相机 up 轴 = 世界 −Z，py(z) = (1 + (z + posZ)/a2) * h/2，令 py = (top+bot)/2 解出 posZ
   scene.position.x = 0;
   scene.position.z = ((top + bot) / h - 1) * a2;
 }
 addEventListener('resize', () => {
   renderer.setSize(innerWidth, innerHeight);
  fitCamera();
});
fitCamera();
</script>
